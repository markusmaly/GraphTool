[package]
name = "gt-app"
version.workspace = true
description = "GraphTool GUI — deckcraft-style slide canvas with thinkcell-style charts"
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gt-app"
path = "src/main.rs"

[dependencies]
ganttcore = { path = "../ganttcore" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "glow", "wayland", "x11", "web_screen_reader", "default_fonts"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
